name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  feature-matrix:
    name: superbuild (${{ matrix.name }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # include-only: the platforms do not cover the same set of configurations,
        # so the combinations are listed rather than crossed. Linux runs every
        # feature combination; Windows runs the two ends of the range -- all
        # modules on, and moth_core alone -- which is what catches a portability
        # break without doubling the matrix.
        include:
          - platform: linux
            os: ubuntu-latest
            name: full
            flags: "-DMOTH_ENABLE_TOOLS=ON"
          - platform: linux
            os: ubuntu-latest
            name: core-only
            flags: "-DMOTH_ENABLE_GFX=OFF -DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_ECS=OFF -DMOTH_ENABLE_PHYSICS=OFF -DMOTH_ENABLE_TILEMAP=OFF -DMOTH_ENABLE_AUDIO=OFF -DMOTH_ENABLE_ASSETS=OFF -DMOTH_ENABLE_ANIM=OFF -DMOTH_ENABLE_NET=OFF -DMOTH_ENABLE_NOISE=OFF -DMOTH_ENABLE_PROFILE=OFF -DMOTH_ENABLE_PACKER=OFF -DMOTH_ENABLE_TOOLKIT=OFF"
          # moth::packer without moth::ui - the configuration a tool that only
          # packs images (moth_sprite) consumes, so the UI-free half stays honest.
          - platform: linux
            os: ubuntu-latest
            name: packer-no-ui
            flags: "-DMOTH_ENABLE_GFX=OFF -DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_ECS=OFF -DMOTH_ENABLE_PHYSICS=OFF -DMOTH_ENABLE_TILEMAP=OFF -DMOTH_ENABLE_AUDIO=OFF -DMOTH_ENABLE_ASSETS=OFF -DMOTH_ENABLE_ANIM=OFF -DMOTH_ENABLE_NET=OFF -DMOTH_ENABLE_NOISE=OFF -DMOTH_ENABLE_PROFILE=OFF -DMOTH_ENABLE_TOOLKIT=OFF"
          - platform: linux
            os: ubuntu-latest
            name: core-gfx
            flags: "-DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_TOOLKIT=OFF"
          - platform: linux
            os: ubuntu-latest
            name: game-example
            flags: "-DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_TOOLKIT=OFF -DMOTH_ENABLE_EXAMPLES=ON"
          - platform: linux
            os: ubuntu-latest
            name: core-ui
            flags: "-DMOTH_ENABLE_GFX=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_ANIM=OFF -DMOTH_ENABLE_TOOLKIT=OFF -DMOTH_ENABLE_TILEMAP=OFF"
          # Pinned rather than windows-latest so the toolchain cannot change under
          # CI without a commit. Note this does not avoid Visual Studio 2026: the
          # windows-2025 label now resolves to the windows-2025-vs2026 image as
          # well. VS 2026 is handled in the Configure step, by pointing recipes
          # at the runner's own CMake.
          - platform: windows
            os: windows-2025
            name: full
            flags: "-DMOTH_ENABLE_TOOLS=ON"
          - platform: windows
            os: windows-2025
            name: core-only
            flags: "-DMOTH_ENABLE_GFX=OFF -DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_ECS=OFF -DMOTH_ENABLE_PHYSICS=OFF -DMOTH_ENABLE_TILEMAP=OFF -DMOTH_ENABLE_AUDIO=OFF -DMOTH_ENABLE_ASSETS=OFF -DMOTH_ENABLE_ANIM=OFF -DMOTH_ENABLE_NET=OFF -DMOTH_ENABLE_NOISE=OFF -DMOTH_ENABLE_PROFILE=OFF -DMOTH_ENABLE_PACKER=OFF -DMOTH_ENABLE_TOOLKIT=OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux resolves GLFW/FreeType/HarfBuzz/Vulkan from the system; on Windows
      # the recipes pull them from Conan instead, so there is nothing to install.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang-tidy: this job configures with MOTH_ENABLE_CLANG_TIDY=ON, which
          # now fails the configure outright if the binary is absent.
          sudo apt-get install -y pkg-config libglfw3-dev libfreetype-dev libharfbuzz-dev libvulkan-dev clang-tidy

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Allow Conan to install missing system packages
        if: runner.os == 'Linux'
        run: |
          conan config home
          echo 'tools.system.package_manager:mode=install' >> "$(conan config home)/global.conf"
          echo 'tools.system.package_manager:sudo=True' >> "$(conan config home)/global.conf"

      - name: Configure
        shell: bash
        env:
          # Conan emits a single-config generator on Linux, where the configure
          # and build presets share the name conan-release. On Windows it emits
          # the multi-config Visual Studio generator, whose single configure
          # preset is conan-default and whose build presets are per configuration.
          CONFIGURE_PRESET: ${{ runner.os == 'Windows' && 'conan-default' || 'conan-release' }}
          # clang-tidy cannot lint an MSVC build, so linting is a Linux concern.
          # The CMake guards already skip it under MSVC; this keeps the intent
          # visible in the workflow rather than only in the CMakeLists.
          TIDY: ${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
          # Conan's autodetected MSVC profile defaults to cppstd=14, and every
          # module here is C++17 (CMAKE_CXX_STANDARD 17) as are five of the
          # dependencies, which fail validation at 14. Linux never hit this
          # because its detected profile is already gnu17 -- which is what
          # CMAKE_CXX_EXTENSIONS=ON produces there, so it is left detected
          # rather than forced, to keep the package_id consumers resolve.
          #
          # The recipes check_min_cppstd(17), but that only rejects a lower
          # standard with a clear message; it cannot raise the profile's, so the
          # setting still has to be passed. The fastnoise2 shared workaround that
          # used to sit here now lives in the recipes that consume it.
          CONAN_EXTRA_ARGS: ${{ runner.os == 'Windows' && '-s compiler.cppstd=17' || '' }}
        run: |
          # The MOTH_ENABLE_* flags for this configuration also decide which
          # dependencies Conan has to provision, so they are translated into the
          # matching -o enable_* options rather than maintained twice.
          CONAN_OPTS=""
          for flag in ${{ matrix.flags }}; do
            case "$flag" in
              -DMOTH_ENABLE_*=ON|-DMOTH_ENABLE_*=OFF)
                kv=${flag#-DMOTH_ENABLE_}
                key=$(echo "${kv%%=*}" | tr '[:upper:]' '[:lower:]')
                [ "${kv#*=}" = "ON" ] && val=True || val=False
                CONAN_OPTS="$CONAN_OPTS -o enable_$key=$val"
                ;;
            esac
          done
          echo "conan options: $CONAN_OPTS"
          # ConanCenter recipes tool_require CMake with ranges that exclude 4.x
          # (vulkan-loader asks for [>=3.17.2 <4.0], resolving to 3.31.12), which
          # predates the "Visual Studio 18 2026" generator Conan selects for MSVC
          # 195 -- they fail with "Could not create named generator". The
          # generator is fine: the runner's own CMake drives it, which is how the
          # superbuild configures at all. Pointing recipes at that CMake is what
          # fixes it. A profile replace_tool_requires does not: it leaves the
          # recipe's own range resolving to 3.31.12 regardless of the pattern.
          # An array, not a string: the path is C:/Program Files/CMake/bin/cmake.exe
          # and unquoted word splitting broke it in two at the space.
          CMAKE_ARG=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            # cygpath -ms: the 8.3 short path (C:/PROGRA~1/...). Conan does not
            # quote cmake_program when it runs it, so a path containing a space
            # fails with "'C:/Program' is not recognized as an internal or
            # external command".
            CMAKE_PROG="$(cygpath -ms "$(command -v cmake)")"
            CMAKE_ARG=(-c "tools.cmake:cmake_program=$CMAKE_PROG")
            echo "forcing recipe cmake: $CMAKE_PROG ($(cmake --version | head -1))"
          fi
          conan install . -of build --build=missing -s build_type=Release "${CMAKE_ARG[@]}" $CONAN_OPTS $CONAN_EXTRA_ARGS
          # Listed so that a preset-name mismatch shows the available names in
          # the log instead of only "no such preset".
          cmake --list-presets || true
          cmake --preset "$CONFIGURE_PRESET" -DMOTH_ENABLE_CLANG_TIDY=$TIDY ${{ matrix.flags }}

      - name: Build
        shell: bash
        run: cmake --build --preset conan-release

  # Linux only for now. Both jobs drive Conan and CMake through shell scripts
  # that assume POSIX paths (/tmp fixtures, ./build/Release/<exe>) and a
  # single-config generator, so running them on Windows is a port of the scripts
  # rather than a matrix entry. The superbuild matrix above is what covers
  # Windows compilation; extend these once that is proven green.
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libfreetype-dev libharfbuzz-dev libvulkan-dev

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Allow Conan to install missing system packages
        run: |
          conan config home
          echo 'tools.system.package_manager:mode=install' >> "$(conan config home)/global.conf"
          echo 'tools.system.package_manager:sudo=True' >> "$(conan config home)/global.conf"

      - name: Create the module packages the tests depend on
        run: |
          set -e
          # Nearly every module's tests require moth_core; the packer tests also
          # build layouts, so they need moth_ui (which itself needs moth_core).
          for m in core ui; do
            echo "::group::conan create moth $m"
            (cd "modules/$m" && conan create . --build=missing -s build_type=Release)
            echo "::endgroup::"
          done

      - name: Build and run every module's tests
        run: |
          set -e
          # Driven off the tests directories rather than a hand-written list, so a
          # new module with tests is covered the moment it lands.
          for testdir in modules/*/tests; do
            module="$(basename "$(dirname "$testdir")")"
            extra=""
            case "$module" in
              gfx) extra="-o enable_glslang=True" ;;
            esac
            echo "::group::$module tests"
            (
              cd "$testdir"
              conan install . --build=missing -s build_type=Release $extra
              cmake --preset conan-release
              cmake --build --preset conan-release
              ctest --preset conan-release --output-on-failure
            )
            echo "::endgroup::"
          done

  # Linux only for now. Both jobs drive Conan and CMake through shell scripts
  # that assume POSIX paths (/tmp fixtures, ./build/Release/<exe>) and a
  # single-config generator, so running them on Windows is a port of the scripts
  # rather than a matrix entry. The superbuild matrix above is what covers
  # Windows compilation; extend these once that is proven green.
  packaged-consumption:
    name: packaged consumption (conan create + find_package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libfreetype-dev libharfbuzz-dev libvulkan-dev

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Allow Conan to install missing system packages
        run: |
          conan config home
          echo 'tools.system.package_manager:mode=install' >> "$(conan config home)/global.conf"
          echo 'tools.system.package_manager:sudo=True' >> "$(conan config home)/global.conf"

      - name: Create modules as packages (dependency order)
        run: |
          # tools/moth_create.py owns the dependency order and fails if a module
          # in modules/ is missing from its list, so this cannot silently skip one.
          python3 tools/moth_create.py -s build_type=Release

      - name: Build a packaged consumer (hello_game via find_package)
        working-directory: examples/hello_game
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release

      - name: Build the shader demo against a glslang-enabled moth_graphics
        run: |
          set -e
          (cd modules/gfx && conan create . --build=missing -s build_type=Release -o enable_glslang=True)
          cd examples/shader_demo
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release

      - name: Build and smoke-test moth_pak (packaged)
        working-directory: tools/moth_pak
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          mkdir -p /tmp/moth_pak_smoke/input/sub
          printf 'hello' > /tmp/moth_pak_smoke/input/a.txt
          printf 'world' > /tmp/moth_pak_smoke/input/sub/b.txt
          ./build/Release/moth_pak /tmp/moth_pak_smoke/input --pak /tmp/moth_pak_smoke/out.pak --manifest /tmp/moth_pak_smoke/manifest.json
          test -s /tmp/moth_pak_smoke/out.pak
          test -s /tmp/moth_pak_smoke/manifest.json

      - name: Build and smoke-test moth_packer (packaged)
        working-directory: tools/moth_packer
        run: |
          set -e
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release

          # Three solid-colour PNGs, written with nothing but the stdlib so the
          # smoke test needs no image tooling on the runner.
          mkdir -p /tmp/moth_packer_smoke/input /tmp/moth_packer_smoke/out
          python3 - <<'PY'
          import struct, zlib

          def chunk(tag, data):
              return (struct.pack(">I", len(data)) + tag + data
                      + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff))

          def write_png(path, w, h, rgba):
              raw = b"".join(b"\x00" + bytes(rgba) * w for _ in range(h))
              open(path, "wb").write(
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(raw))
                  + chunk(b"IEND", b""))

          write_png("/tmp/moth_packer_smoke/input/red.png", 16, 16, (255, 0, 0, 255))
          write_png("/tmp/moth_packer_smoke/input/green.png", 24, 8, (0, 255, 0, 255))
          write_png("/tmp/moth_packer_smoke/input/blue.png", 8, 32, (0, 0, 255, 255))
          PY

          ./build/Release/moth_packer -d /tmp/moth_packer_smoke/input -o /tmp/moth_packer_smoke/out atlas
          test -s /tmp/moth_packer_smoke/out/atlas_0.png
          test -s /tmp/moth_packer_smoke/out/atlas.json
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/moth_packer_smoke/out/atlas.json'))
          n = sum(len(a['images']) for a in d['atlases'])
          sys.exit(0 if n == 3 else 'expected 3 packed images, got %d' % n)"

          # unpack the atlas back into individual sprites
          ./build/Release/moth_packer --mode unpack /tmp/moth_packer_smoke/out/atlas_0.png -o /tmp/moth_packer_smoke/out
          test -s /tmp/moth_packer_smoke/out/sprite_0.png

      - name: Build and run the packed-audio example (headless)
        working-directory: examples/packed_audio_demo
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ./build/Release/packed_audio_demo --null
