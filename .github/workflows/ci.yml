name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  feature-matrix:
    name: superbuild (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: full
            flags: "-DMOTH_ENABLE_TOOLS=ON"
          - name: core-only
            flags: "-DMOTH_ENABLE_GFX=OFF -DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_ECS=OFF -DMOTH_ENABLE_PHYSICS=OFF -DMOTH_ENABLE_TILEMAP=OFF -DMOTH_ENABLE_AUDIO=OFF -DMOTH_ENABLE_ASSETS=OFF -DMOTH_ENABLE_TOOLKIT=OFF"
          - name: core-gfx
            flags: "-DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_TOOLKIT=OFF"
          - name: game-example
            flags: "-DMOTH_ENABLE_UI=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_TOOLKIT=OFF -DMOTH_ENABLE_EXAMPLES=ON"
          - name: core-ui
            flags: "-DMOTH_ENABLE_GFX=OFF -DMOTH_ENABLE_BRIDGE=OFF -DMOTH_ENABLE_TOOLKIT=OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libfreetype-dev libharfbuzz-dev libvulkan-dev

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Configure
        run: |
          conan install . -of build --build=missing -s build_type=Release
          cmake --preset conan-release ${{ matrix.config.flags }}

      - name: Build
        run: cmake --build --preset conan-release

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libfreetype-dev libharfbuzz-dev libvulkan-dev

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Create moth_core package (needed by the module tests)
        working-directory: modules/core
        run: conan create . --build=missing -s build_type=Release

      - name: Build and run core tests
        working-directory: modules/core/tests
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

      - name: Build and run gfx tests
        working-directory: modules/gfx/tests
        run: |
          conan install . --build=missing -s build_type=Release -o enable_glslang=True
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

      - name: Build and run ui tests
        working-directory: modules/ui/tests
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

      - name: Build and run ecs tests
        working-directory: modules/ecs/tests
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

      - name: Build and run physics tests
        working-directory: modules/physics/tests
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

      - name: Build and run tilemap tests
        working-directory: modules/tilemap/tests
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

      - name: Build and run audio tests
        working-directory: modules/audio/tests
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

      - name: Build and run assets tests
        working-directory: modules/assets/tests
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ctest --preset conan-release --output-on-failure

  packaged-consumption:
    name: packaged consumption (conan create + find_package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libfreetype-dev libharfbuzz-dev libvulkan-dev

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Create modules as packages (dependency order)
        run: |
          set -e
          for m in core gfx ui ecs physics tilemap audio assets bridge toolkit; do
            (cd "modules/$m" && conan create . --build=missing -s build_type=Release)
          done

      - name: Build a packaged consumer (hello_game via find_package)
        working-directory: examples/hello_game
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release

      - name: Build the shader demo against a glslang-enabled moth_graphics
        run: |
          set -e
          (cd modules/gfx && conan create . --build=missing -s build_type=Release -o enable_glslang=True)
          cd examples/shader_demo
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release

      - name: Build and smoke-test moth_pak (packaged)
        working-directory: tools/moth_pak
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          mkdir -p /tmp/moth_pak_smoke/input/sub
          printf 'hello' > /tmp/moth_pak_smoke/input/a.txt
          printf 'world' > /tmp/moth_pak_smoke/input/sub/b.txt
          ./build/Release/moth_pak /tmp/moth_pak_smoke/input --pak /tmp/moth_pak_smoke/out.pak --manifest /tmp/moth_pak_smoke/manifest.json
          test -s /tmp/moth_pak_smoke/out.pak
          test -s /tmp/moth_pak_smoke/manifest.json

      - name: Build and run the packed-audio example (headless)
        working-directory: examples/packed_audio_demo
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset conan-release
          cmake --build --preset conan-release
          ./build/Release/packed_audio_demo --null
