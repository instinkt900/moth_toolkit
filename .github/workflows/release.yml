name: Release & Publish Conan Packages

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Space-separated module dirs to force-release (empty = every module whose version lacks a Linux or Windows binary on the remote). e.g. "core gfx ui"'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'modules/*/version.txt'

permissions:
  contents: write

# Serialize runs: publishing to a shared Conan remote must not race.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version bumps
    runs-on: ubuntu-latest
    outputs:
      release_modules: ${{ steps.detect.outputs.release_modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine modules to publish
        id: detect
        shell: bash
        env:
          MANUAL_MODULES: ${{ github.event.inputs.modules }}
          ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
        run: |
          set -euo pipefail

          # A module is published when the version in its version.txt has no
          # binary on the remote for Linux or Windows. A code-only fix to one
          # module leaves its version alone and so never republishes it or its
          # dependencies, and a release that uploaded one platform but failed on
          # the other is retried. The remote allows anonymous reads, so no login
          # is needed here. The script fails if the remote cannot be queried.
          if [ -n "$MANUAL_MODULES" ]; then
            release_modules="$MANUAL_MODULES"
          else
            release_modules="$(python3 tools/moth_unpublished.py "$ARTIFACTORY_URL" --os Linux --os Windows)"
          fi

          echo "release_modules=$release_modules" >> "$GITHUB_OUTPUT"
          echo "Release: [$release_modules]"

  publish:
    name: Build & upload (${{ matrix.platform }})
    if: needs.detect.outputs.release_modules != ''
    needs: detect
    runs-on: ${{ matrix.os }}
    strategy:
      # Each platform publishes its own binaries under the same recipe, so a
      # failure on one must not cancel an upload already under way on the other.
      fail-fast: false
      # One upload at a time, for the same reason the whole workflow is
      # serialised: the platforms share a recipe revision on the remote and
      # should not push it concurrently.
      max-parallel: 1
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          # windows-2022, not windows-latest or windows-2025: both of those now serve
          # Visual Studio 2026 (MSVC 195), which ConanCenter cannot build for yet --
          # its generator needs CMake 4.2 and many recipes cap CMake below 4, and
          # there are no prebuilt 195 binaries. GitHub's guidance for VS 2022 is
          # this image. Revisit when windows-2022 is retired or ConanCenter catches
          # up; the VS 2026 workaround is in git history (tools.cmake:cmake_program).
          - platform: windows
            os: windows-2022
    env:
      # The Windows runners provide 'python'; ubuntu provides 'python3'.
      PY: ${{ matrix.os == 'windows-2022' && 'python' || 'python3' }}
      # Conan's autodetected MSVC profile defaults to cppstd=14, below the C++17
      # every module and five of the dependencies require. Linux is left as
      # detected (gnu17, matching CMAKE_CXX_EXTENSIONS) so that its package_id
      # stays the one a consumer's own detected profile resolves to.
      # The recipes check_min_cppstd(17), which rejects a lower standard with a
      # clear message but cannot raise the profile's, so it is still passed here.
      CONAN_EXTRA_ARGS: ${{ matrix.os == 'windows-2022' && '-s compiler.cppstd=17' || '' }}
    steps:
      # The Windows image checks out with CRLF line endings. Conan hashes the
      # exported sources into the recipe revision, so CRLF gives Windows a
      # different revision from Linux and splits a version's binaries across
      # two revisions. Check out with LF everywhere; this also covers submodules.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux resolves GLFW/FreeType/HarfBuzz/Vulkan from the system; on Windows
      # the recipes pull them from Conan instead, so there is nothing to install.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libfreetype-dev libharfbuzz-dev libvulkan-dev

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      # A dependency built from source can need system packages the step above
      # does not install (vulkan-loader pulls in xorg/system). Conan only checks
      # for them by default and fails, so let it install them, as ci.yml does.
      - name: Allow Conan to install missing system packages
        if: runner.os == 'Linux'
        run: |
          echo 'tools.system.package_manager:mode=install' >> "$(conan config home)/global.conf"
          echo 'tools.system.package_manager:sudo=True' >> "$(conan config home)/global.conf"

      - name: Add private artifactory remote
        shell: bash
        run: |
          conan remote add artifactory "${{ vars.ARTIFACTORY_URL }}" --force
          conan remote login artifactory "${{ vars.ARTIFACTORY_USER }}" -p "${{ secrets.ARTIFACTORY_TOKEN }}"

      - name: Build and upload the bumped modules
        shell: bash
        env:
          RELEASE_MODULES: ${{ needs.detect.outputs.release_modules }}
          MANUAL_MODULES: ${{ github.event.inputs.modules }}
          ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
        run: |
          set -euo pipefail
          # Build order and package names come from tools/moth_create.py, which is
          # the single source of truth and fails if a module in modules/ is not
          # listed — that is how net, noise, profile and packer went unpublished.
          # tr: Python on Windows ends lines with CRLF, which would leave a '\r'
          # on every package name.
          declare -A PKG=()
          ORDER=()
          while read -r m pkg; do
            PKG[$m]="$pkg"
            ORDER+=("$m")
          done < <($PY tools/moth_create.py --list --with-packages | tr -d '\r')

          # A module detect picked because the other platform lacks it is skipped
          # here when this platform already has its binary. Modules named by hand
          # are always rebuilt.
          if [ -z "$MANUAL_MODULES" ]; then
            RELEASE_MODULES="$($PY tools/moth_unpublished.py "$ARTIFACTORY_URL" --os "$RUNNER_OS" | tr -d '\r')"
          fi
          echo "Publishing on $RUNNER_OS: [$RELEASE_MODULES]"

          # Export every recipe first. Modules pin their siblings to exact
          # versions (moth_packer requires moth_core/0.1.0), so a lone packer
          # release still has to resolve moth_core. Exporting is recipe-only and
          # costs seconds; it publishes nothing. With the recipes in the cache,
          # --build=missing below downloads a dependency's binary from the remote
          # when it exists and builds it locally when it does not, which is what
          # makes a release work against a cold remote.
          for m in "${ORDER[@]}"; do
            conan export "modules/$m" >/dev/null
          done

          # Only the bumped modules are created and uploaded.
          for m in "${ORDER[@]}"; do
            if [[ " $RELEASE_MODULES " != *" $m "* ]]; then
              continue
            fi
            pkg="${PKG[$m]}"
            version="$(tr -d '[:space:]' < "modules/$m/version.txt")"

            echo "::group::publish ${pkg}/${version}"
            # The default build, then every published variant (moth_create.py's
            # VARIANTS). Each produces a distinct package_id under the same
            # reference, so a consumer that needs e.g. moth_core with
            # enable_platform=False gets a binary instead of building from source.
            conan create "modules/$m" --build=missing -s build_type=Release $CONAN_EXTRA_ARGS
            while read -r variant; do
              [ -n "$variant" ] || continue
              opts=()
              for option in $variant; do
                opts+=(-o "$option")
              done
              echo "-- variant: $variant"
              conan create "modules/$m" --build=missing -s build_type=Release $CONAN_EXTRA_ARGS "${opts[@]}"
            done < <($PY tools/moth_create.py --list-variants "$m" | tr -d '\r')

            # ':*' uploads every binary of this reference, so the default build
            # and all its variants ship together. A dependency built from source
            # along the way stays in the local cache and is not published.
            conan upload "${pkg}/${version}:*" --confirm -r artifactory
            echo "::endgroup::"
          done

  release:
    name: Tag & GitHub Release
    needs: [detect, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tags and releases
        shell: bash
        env:
          RELEASE_MODULES: ${{ needs.detect.outputs.release_modules }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Package names come from tools/moth_create.py, as in the publish job.
          declare -A PKG=()
          while read -r m pkg; do
            PKG[$m]="$pkg"
          done < <(python3 tools/moth_create.py --list --with-packages)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for m in $RELEASE_MODULES; do
            pkg="${PKG[$m]}"
            version="$(tr -d '[:space:]' < "modules/$m/version.txt")"
            tag="${pkg}/${version}"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "tag $tag already exists; skipping release"
              continue
            fi

            # Release notes: commits touching this module since its last tag.
            # --match covers both the current tag scheme and the older gfx-0.10.1
            # style, so the first release after the rename does not dump the
            # module's entire history into the notes.
            prev_tag="$(git describe --tags --abbrev=0 \
              --match "${pkg}/*" --match "${m}-*" 2>/dev/null || true)"
            if [ -n "$prev_tag" ]; then
              notes="$(git log --oneline "$prev_tag..HEAD" -- "modules/$m" | sed 's/^/- /' || true)"
            else
              notes="$(git log --oneline -30 -- "modules/$m" | sed 's/^/- /' || true)"
            fi
            [ -n "$notes" ] || notes="Release ${pkg} ${version}"

            echo "tagging $tag and creating release"
            git tag "$tag"
            git push origin "$tag"

            gh release create "$tag" \
              --title "${pkg} ${version}" \
              --notes "$notes"
          done
